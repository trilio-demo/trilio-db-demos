apiVersion: triliovault.trilio.io/v1
kind: BackupPlan
metadata:
  name: sqlserver-backupplan
spec:
  backupConfig:
    target:
      name: demo-nfs-target       # ← replace with your Target CR name
      namespace: trilio-system    # ← replace with your Target CR namespace
  hookConfig:
    mode: Sequential
    hooks:
      - hook:
          name: sqlserver-hook
          namespace: ${DEMO_NS}   # ← replace with the namespace where you applied the Hook
        podSelector:
          labels:
            - matchLabels:
                app: sqlserver
        containerRegex: "sqlserver"
  backupPlanComponents: {}
